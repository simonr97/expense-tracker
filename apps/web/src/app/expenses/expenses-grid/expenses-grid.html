<!-- No fixed height: the grid takes what's left of the content column and scrolls inside -->
<section class="flex h-full flex-col rounded-lg border border-border-light bg-bg-surface p-5 shadow-sm">
  <ag-grid-angular
    class="min-h-0 w-full flex-1"
    [theme]="gridTheme"
    [columnDefs]="columnDefs"
    [defaultColDef]="defaultColDef"
    (gridReady)="onGridReady($event)"
    [rowData]="expensesOfMonth()"
    [rowSelection]="rowSelection"
    [getRowId]="rowId"
    (selectionChanged)="onSelectionChanged($event)"
    [loading]="expensesByYearMonth.isLoading()"
  />
</section>
