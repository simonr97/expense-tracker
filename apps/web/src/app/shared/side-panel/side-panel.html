<aside
  class="flex h-full flex-col gap-5 rounded-lg border border-border-light bg-bg-surface p-5 shadow-sm"
  [attr.aria-label]="title()"
>
  <!-- Fixed header: title, close button and, optionally, content marked with `panelHeader` (e.g. the category avatar) -->
  <header class="flex items-start justify-between gap-3">
    <div class="flex min-w-0 flex-1 flex-col gap-4">
      <h2 class="text-base font-semibold text-text-primary">{{ title() }}</h2>
      <ng-content select="[panelHeader]" />
    </div>
    <!-- Same close button as AddTransactionDialog -->
    <button
      type="button"
      aria-label="Close panel"
      (click)="onClosed()"
      class="flex h-10 w-10 shrink-0 items-center justify-center rounded-md border border-border-light text-text-secondary transition-colors hover:bg-bg-hover focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-primary/12"
    >
      <app-icon-renderer [iconName]="'x'" [iconColor]="'currentColor'" [size]="20" />
    </button>
  </header>

  <!-- Content scrolls; header and actions stay in place. min-h-0 lets it shrink inside the flex column. -->
  <div class="flex min-h-0 flex-1 flex-col gap-4 overflow-y-auto">
    <ng-content />
  </div>

  <!-- Elements marked with `panelActions` go here. empty:hidden: with nothing projected, the footer and its border disappear. -->
  <footer class="flex gap-3 border-t border-border-light pt-4 empty:hidden">
    <ng-content select="[panelActions]" />
  </footer>
</aside>
