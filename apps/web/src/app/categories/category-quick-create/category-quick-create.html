<form
  (submit)="onSubmitNewCategory($event)"
  class="flex w-full flex-col gap-3 rounded-md bg-bg-surface-soft p-4 text-sm"
>
  <!-- Header (no back arrow: Cancel is the way back) -->
  <header>
    <h2 class="text-base font-semibold text-text-primary">Create Category</h2>
    <p class="text-[13px] text-text-secondary">Add a new category to organize your expenses.</p>
  </header>

  <!-- Callout (design system); inline until the shared Callout component exists -->
  <div class="flex gap-2.5 rounded-md bg-primary-soft p-3 text-[13px] text-text-secondary">
    <app-icon-renderer class="flex shrink-0 pt-0.5 text-primary" [iconName]="'info'" [iconColor]="'currentColor'" [size]="16" />
    <p>Categories help you group your expenses (e.g., Food &amp; Dining, Transport, Home, Entertainment).</p>
  </div>

  <!-- Category Name -->
  <label class="flex flex-col gap-1.5">
    <span class="text-[13px] text-text-secondary">Category Name</span>
    <input
      type="text"
      [formField]="categoryForm.name"
      class="h-10 rounded-md border border-border-medium bg-bg-surface px-3 text-sm text-text-primary focus:border-primary focus:ring-4 focus:ring-primary/12 focus:outline-none"
    />
  </label>
  <!-- Category Name -->

  <!-- Category Color -->
  <app-color-swatch-picker [formField]="categoryForm.color" [colors]="colors" />
  <!-- Category Color -->

  <!-- Category Icon -->
  <app-icon-grid-picker
    [formField]="categoryForm.icon"
    [icons]="icons"
    [accentColor]="categoryFormModel().color"
  />
  <!-- Category Icon -->

  <!-- Category Preview -->
  <div class="flex flex-col gap-2">
    <p class="text-[13px] text-text-secondary">Category Preview</p>
    <div class="flex">
      <app-category-badge [category]="preview()" size="lg" />
    </div>
  </div>
  <!-- Category Preview -->

  <div class="flex gap-3">
    <button
      type="button"
      (click)="onClosed()"
      class="h-11 rounded-md border border-border-medium bg-bg-surface px-4 text-sm font-semibold text-text-primary transition-colors hover:bg-bg-hover focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-primary/12"
    >
      Cancel
    </button>
    <button
      type="submit"
      class="h-11 flex-1 rounded-md bg-primary px-4 text-sm font-semibold text-white shadow-[0_6px_16px_rgba(10,132,255,0.22)] hover:bg-primary-hover"
    >
      Create Category
    </button>
  </div>
</form>
