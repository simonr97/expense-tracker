<div
  class="inline-flex items-center rounded-lg"
  [class]="dimensions().padding"
  [style.background-color] = "backgroundColor()"
>
  <app-icon-renderer [iconName]="category().icon" [iconColor]="displayColor()" [size]="dimensions().icon" />
  <span
    class="font-medium leading-none whitespace-nowrap"
    [style.color]="displayColor()"
    [style.font-size.px]="dimensions().text"
  >
    {{ category().name }}
  </span>
</div>
