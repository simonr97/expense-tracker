<button
  #trigger
  cdkOverlayOrigin
  #origin="cdkOverlayOrigin"
  type="button"
  role="combobox"
  aria-haspopup="listbox"
  [attr.aria-expanded]="open()"
  [attr.aria-controls]="listboxId"
  [attr.aria-activedescendant]="activeOptionId()"
  [attr.aria-labelledby]="labelledBy()"
  [attr.aria-required]="required()"
  (click)="toggle()"
  (keydown)="onKeydown($event)"
  class="flex h-10 w-full items-center justify-between gap-2 rounded-md border bg-bg-surface px-3 text-left text-sm focus:border-primary focus:ring-4 focus:ring-primary/12 focus:outline-none"
  [class.border-primary]="open()"
  [class.border-border-medium]="!open()"
>
  @if (selected(); as category) {
    <app-category-badge [category]="category" />
  } @else {
    <span class="text-text-tertiary">{{ placeholder() }}</span>
  }
  <app-icon-renderer
    class="flex shrink-0 text-text-secondary transition-transform duration-200"
    [class.rotate-180]="open()"
    [iconName]="'chevron-down'"
    [iconColor]="'currentColor'"
    [size]="16"
  />
</button>

<ng-template
  cdkConnectedOverlay
  [cdkConnectedOverlayOrigin]="origin"
  [cdkConnectedOverlayOpen]="open()"
  [cdkConnectedOverlayPositions]="positions"
  [cdkConnectedOverlayWidth]="triggerWidth()"
  (overlayOutsideClick)="onOutsideClick($event)"
  (detach)="close()"
>
  <ul
    [id]="listboxId"
    role="listbox"
    [attr.aria-labelledby]="labelledBy()"
    class="max-h-64 overflow-y-auto rounded-md border border-border-light bg-bg-surface p-1 shadow-md"
  >
    @for (category of categories(); track category.id; let i = $index) {
      @let isSelected = category.id === value();
      <li
        role="option"
        [id]="optionId(i)"
        [attr.aria-selected]="isSelected"
        (click)="select(i)"
        (mouseenter)="activeIndex.set(i)"
        class="flex cursor-pointer items-center justify-between gap-2 rounded-[10px] px-2 py-1.5"
        [class.bg-primary-selected]="isSelected"
        [class.bg-bg-hover]="!isSelected && i === activeIndex()"
        [class.outline-2]="i === activeIndex()"
        [class.outline-primary]="i === activeIndex()"
      >
        <app-category-badge [category]="category" />
        @if (isSelected) {
          <app-icon-renderer class="flex shrink-0 text-primary" [iconName]="'check'" [iconColor]="'currentColor'" [size]="16" />
        }
      </li>
    }
  </ul>
</ng-template>
