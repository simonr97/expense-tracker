<div class="flex flex-col gap-5">
<div class="grid grid-cols-1 gap-5 md:grid-cols-2">
<form
  id="income-form"
  (submit)="onSubmitNewIncome($event)"
  class="flex min-w-0 flex-col gap-4"
>

  <!-- Income Name -->
  <label class="flex flex-col gap-1.5">
    <span class="text-[13px] text-text-secondary">
      Name <span class="text-danger" aria-hidden="true">*</span>
    </span>
    <input
      type="text"
      placeholder="e.g., Salary, Freelance, Investment"
      [formField]="incomeForm.description"
      class="h-10 rounded-md border border-border-medium bg-bg-surface px-3 text-sm text-text-primary placeholder:text-text-tertiary focus:border-primary focus:ring-4 focus:ring-primary/12 focus:outline-none"
    />
  </label>
  <!-- Income Name -->

  <!-- Income Amount -->
  <label class="flex flex-col gap-1.5">
    <span class="text-[13px] text-text-secondary">
      Income Amount <span class="text-danger" aria-hidden="true">*</span>
    </span>
    <input
      type="number"
      step="0.01"
      placeholder="0.00"
      [formField]="incomeForm.amount"
      class="h-10 rounded-md border border-border-medium bg-bg-surface px-3 text-sm text-text-primary placeholder:text-text-tertiary focus:border-primary focus:ring-4 focus:ring-primary/12 focus:outline-none"
    />
  </label>
  <!-- Income Amount -->

  <!-- Income Currency -->
  <label class="flex flex-col gap-1.5">
    <span class="text-[13px] text-text-secondary">
      Income Currency <span class="text-danger" aria-hidden="true">*</span>
    </span>
    <select
      [formField]="incomeForm.currency"
      class="h-10 rounded-md border border-border-medium bg-bg-surface px-3 text-sm text-text-primary focus:border-primary focus:ring-4 focus:ring-primary/12 focus:outline-none"
    >
      <option value="" disabled hidden>Select a Currency</option>
      @for(currency of currencys; track currency)
      {
        <option [value]="currency">
          {{currency}}
        </option>
      }
    </select>
  </label>
  <!-- Income Currency -->

  <!-- Income Date -->
  <label class="flex flex-col gap-1.5">
    <span class="text-[13px] text-text-secondary">
      Date <span class="text-danger" aria-hidden="true">*</span>
    </span>
    <input
      type="date"
      [formField]="incomeForm.date"
      class="h-10 rounded-md border border-border-medium bg-bg-surface px-3 text-sm text-text-primary focus:border-primary focus:ring-4 focus:ring-primary/12 focus:outline-none"
    />
  </label>
  <!-- Income Date -->

  <!-- Income Account -->
  <div class="flex flex-col gap-1.5">
    <div class="flex items-center justify-between gap-2">
      <label for="income-account" class="text-[13px] text-text-secondary">
        Account <span class="text-danger" aria-hidden="true">*</span>
      </label>
      <button
        type="button"
        [attr.aria-pressed]="openCreationForm() === 'account'"
        (click)="openCreationForm() === 'account' ? openCreationForm.set('preview') : openCreationForm.set('account')"
        class="inline-flex items-center gap-1 rounded-full bg-primary-soft px-2.5 py-1 text-xs font-medium text-primary transition-colors hover:bg-primary-selected focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-primary/12"
      >
        <app-icon-renderer [iconName]="'plus'" [iconColor]="'currentColor'" [size]="14" />
        Create Account
      </button>
    </div>
    <select
      id="income-account"
      [formField]="incomeForm.accountId"
      class="h-10 rounded-md border border-border-medium bg-bg-surface px-3 text-sm text-text-primary focus:border-primary focus:ring-4 focus:ring-primary/12 focus:outline-none"
    >
      <option value="" disabled selected hidden>Select an account</option>
      @for(account of accounts.value(); track account.id){
        <option [value]="account.id">
          {{account.name}}
        </option>
      }
    </select>
  </div>
  <!-- Income Account -->
</form>

<!-- Right column. Outside the <form> so the create panels don't end up as nested forms. -->
<aside class="flex min-w-0 flex-col">
  @switch (openCreationForm()) {
    @case ('account') {
      <app-quick-create-form
        label="Account"
        subtitle="Add a new account to track where your money is."
        info="Accounts are where the money goes into (e.g., BBVA Card, Mercado Pago, Savings)."
        [saveNew]="createAccount"
        (created)="handleNewAccountCreation($event)"
        (closed)="onQuickCreateClosed()"
      />
    }
    @case ('preview') {
      <app-income-preview-card [formData]="previewData()" />
    }
  }
</aside>
</div>

<footer class="flex justify-end gap-3 border-t border-border-light pt-4">
  <button
    type="button"
    (click)="dialogRef.close()"
    class="h-11 rounded-md border border-border-medium bg-bg-surface px-4 text-sm font-semibold text-text-primary transition-colors hover:bg-bg-hover focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-primary/12"
  >
    Cancel
  </button>
  <button
    type="submit"
    form="income-form"
    [disabled]="savingIncome()"
    [attr.aria-busy]="savingIncome()"
    class="h-11 rounded-md bg-success px-4 text-sm font-semibold text-white shadow-sm transition-colors hover:opacity-90 focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-success/20 disabled:cursor-default disabled:opacity-60"
  >
     @if(savingIncome()){
      Saving...
    } @else{
      Save Income
    }
  </button>
</footer>
</div>
